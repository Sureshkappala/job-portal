<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Stackly Jobs</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="login-page">

<div class="login-left">

<h1>
Find Your Dream Career
</h1>

<p>
Join thousands of professionals and connect with top companies through Stackly Jobs.
</p>

</div>

<div class="login-right">

<h2>
Welcome Back
</h2>

<div class="role-selection">

<button type="button" onclick="setRole('employee')">
👤 Employee
</button>


<button type="button" onclick="setRole('hr')">
🏢 HR
</button>


<button type="button" onclick="setRole('admin')">
👨‍💼 Admin
</button>


</div>

<input
type="text"
id="email"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button type="button" onclick="checkLogin()">
Login
</button>

<p>

Don't have an account?

<a href="register.html">
Register
</a>

</p>

</div>


</section>

<script src="js/script.js"></script>

</body>

</html>
