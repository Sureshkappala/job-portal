<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Stackly Jobs</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="login-page">

<div class="login-left">

<h1>
Find Your Dream Career
</h1>

<p>
Join thousands of professionals and connect with top companies through Stackly Jobs.
</p>

</div>

<div class="login-right">

<h2>
Welcome Back
</h2>

<div class="role-selection">

<button class="role-btn" type="button" onclick="setRole('employee')">
    👤 Employee
</button>


<button  class="role-btn" type="button" onclick="setRole('hr')">
🏢 HR
</button>


<button  class="role-btn" type="button" onclick="setRole('admin')">
👨‍💼 Admin
</button>


</div>

<input type="email" placeholder="Enter your Email ID" id="email">

<input type="password" placeholder="Enter your Password" id="password">

<a href="pages/404.html" class="forgot-link">
    Forgot Password?
</a>

<button class="login-btn-main" onclick="checkLogin()">

    Login
</button>
<button class="home-btn-login"
onclick="window.location.href='index.html'">
    Back To Home
</button>

<p>

Don't have an account?

<a href="register.html">
Register
</a>

</p>

</div>


</section>

<script src="js/script.js"></script>

</body>

</html>
